name: Build FiveMWantedLighting

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run build.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\build.ps1

      - name: Check build
        shell: pwsh
        run: |
          if (!(Test-Path "publish\FiveMWantedLighting.exe")) {
            Write-Error "FiveMWantedLighting.exe wurde nicht erstellt."
            exit 1
          }

          Write-Host "Build erfolgreich!"
          Write-Host ""
          Write-Host "Dateien in publish:"
          Get-ChildItem "publish" -Recurse

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FiveMWantedLighting-Windows-x64
          path: publish/
          if-no-files-found: error
